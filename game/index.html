<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera Heat — an open-world courier caper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1030; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palmera Heat: top-down open world. Walk and drive with WASD, enter cars with E, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite">Palmera Heat. Press Space to play.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
