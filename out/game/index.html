<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera Heat — an original open-world game in Palmera City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1030; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 190px; height: 190px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palmera Heat: explore Palmera City on foot and by car, complete missions, outrun the police"></canvas>
<canvas id="minimap" width="190" height="190" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
